[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cube-trainer"
version = "0.1.0"
description = "Targeted scramble generation and timing for practising CFOP on a physical 3x3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "kociemba>=1.2",
]

[project.scripts]
cube-trainer = "cubetrainer.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
