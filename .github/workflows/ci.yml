name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # pygame needs a video driver even to build a surface; the runner has no display.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  docs-images:
    name: README images still generate
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # Runs the generator so a change to the drawing code cannot silently break
      # the tool that produces the README's pictures. It deliberately does not
      # byte-compare the output: fonts and SDL builds differ between this runner
      # and whichever machine last regenerated them, so a diff here would mean
      # nothing except that two computers rasterise text differently.
      - name: Regenerate
        run: python tools/make_docs_images.py
      - name: Every picture was written
        run: |
          for f in pll-picker case-t-perm case-t-perm-hidden case-oll case-f2l; do
            test -s "docs/images/$f.png" || { echo "missing or empty: $f.png"; exit 1; }
          done
